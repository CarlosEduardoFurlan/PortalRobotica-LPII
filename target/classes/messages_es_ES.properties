sobre.titulo=Sobre el Laboratorio
sobre.texto1=El Laboratorio de Robótica del IFMS - Campus Campo Grande es un espacio destinado al desarrollo de actividades relacionadas con la robótica, la tecnología y la innovación.
sobre.texto2=El laboratorio reúne a estudiantes y coordinadores en proyectos, competiciones, eventos y otras actividades académicas.
sobre.portalTitulo=Sobre el Portal
sobre.portalTexto=Este portal tiene como objetivo presentar las actividades desarrolladas por el laboratorio, sus estudiantes, proyectos y participaciones.


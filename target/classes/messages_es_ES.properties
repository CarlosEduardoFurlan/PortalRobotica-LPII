sobre.roboticaTitulo=¿Qué es la Robótica en el IFMS?

sobre.roboticaTexto1=La robótica en el IFMS - Campus Campo Grande se desarrolla mediante proyectos y actividades prácticas que acercan a los estudiantes a la tecnología, la programación y la creación de soluciones.

sobre.roboticaTexto2=Durante estas actividades, los estudiantes pueden construir y programar robots, participar en competiciones y ferias científicas y desarrollar habilidades para resolver problemas, integrando el aprendizaje teórico con experiencias prácticas dentro y fuera de la institución.
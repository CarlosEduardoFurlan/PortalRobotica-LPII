sobre.titulo=Sobre o Laboratório
sobre.texto1=O Laboratório de Robótica do IFMS - Campus Campo Grande é um espaço destinado ao desenvolvimento de atividades relacionadas à robótica, tecnologia e inovação.
sobre.texto2=O laboratório reúne estudantes e coordenadores em projetos, competições, eventos e outras atividades acadêmicas.
sobre.portalTitulo=Sobre o Portal
sobre.portalTexto=Este portal tem como objetivo apresentar as atividades desenvolvidas pelo laboratório, seus estudantes, projetos e participações.


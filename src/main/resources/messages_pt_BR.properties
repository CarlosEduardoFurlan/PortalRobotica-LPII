sobre.roboticaTitulo=O que é a Robótica no IFMS?

sobre.roboticaTexto1=A robótica no IFMS - Campus Campo Grande é desenvolvida por meio de projetos e atividades práticas que aproximam os estudantes da tecnologia, da programação e da construção de soluções.

sobre.roboticaTexto2=Durante essas atividades, os estudantes podem construir e programar robôs, participar de competições e feiras científicas e desenvolver habilidades de resolução de problemas, integrando o aprendizado teórico a experiências práticas dentro e fora da instituição.
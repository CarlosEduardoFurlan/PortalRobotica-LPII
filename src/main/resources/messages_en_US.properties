sobre.roboticaTitulo=What is Robotics at IFMS?

sobre.roboticaTexto1=Robotics at IFMS - Campo Grande Campus is developed through projects and practical activities that bring students closer to technology, programming and the development of solutions.

sobre.roboticaTexto2=During these activities, students can build and program robots, participate in competitions and science fairs, and develop problem-solving skills by connecting theoretical learning with practical experiences inside and outside the institution.
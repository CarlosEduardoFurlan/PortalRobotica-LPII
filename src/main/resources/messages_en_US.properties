sobre.titulo=About the Laboratory
sobre.texto1=The IFMS Robotics Laboratory - Campo Grande Campus is a space dedicated to the development of activities related to robotics, technology and innovation.
sobre.texto2=The laboratory brings together students and coordinators in projects, competitions, events and other academic activities.
sobre.portalTitulo=About the Portal
sobre.portalTexto=This portal aims to present the activities developed by the laboratory, its students, projects and participations.


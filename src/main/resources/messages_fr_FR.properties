sobre.roboticaTitulo=Qu'est-ce que la Robotique à l'IFMS ?

sobre.roboticaTexto1=La robotique à l'IFMS - Campus Campo Grande est développée à travers des projets et des activités pratiques qui rapprochent les étudiants de la technologie, de la programmation et de la création de solutions.

sobre.roboticaTexto2=Au cours de ces activités, les étudiants peuvent construire et programmer des robots, participer à des compétitions et à des foires scientifiques et développer leurs compétences en résolution de problèmes, en reliant l'apprentissage théorique à des expériences pratiques à l'intérieur et à l'extérieur de l'institution.
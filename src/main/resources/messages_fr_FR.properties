sobre.titulo=À propos du Laboratoire
sobre.texto1=Le Laboratoire de Robotique de l'IFMS - Campus Campo Grande est un espace consacré au développement d'activités liées à la robotique, à la technologie et à l'innovation.
sobre.texto2=Le laboratoire réunit des étudiants et des coordinateurs dans le cadre de projets, de compétitions, d'événements et d'autres activités académiques.
sobre.portalTitulo=À propos du Portail
sobre.portalTexto=Ce portail a pour objectif de présenter les activités développées par le laboratoire, ses étudiants, ses projets et ses participations.

